name: test-java25

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  obfuscation-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build, obfuscate, and execute all Java 8 fixtures
        run: |
          mvn -B -DskipTests package
          python3 test/run_tests.py --obfuscator target/jar-obfuscator-2.0.1-jar-with-dependencies.jar
